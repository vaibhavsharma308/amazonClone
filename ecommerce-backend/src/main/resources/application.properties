spring.application.name=ecommerce-backend

# Database configuration (H2 In-Memory Database)
spring.datasource.url=jdbc:h2:mem:ecommerce_db
spring.datasource.driver-className=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# SQL Init - loads data.sql on startup
spring.sql.init.mode=always

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

